name: Verify Published Knowledge Bundle
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Read pinned source commit
        id: source
        run: |
          python - <<'PY'
          import json, os, re
          s=json.load(open('skill/references/handbook-manifest.json'))['source_commit']
          assert re.fullmatch('[0-9a-f]{40}',s)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('commit='+s+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: sou350121/VLA-Handbook
          ref: ${{ steps.source.outputs.commit }}
          path: upstream-handbook
          persist-credentials: false
      - name: Verify every source and generated artifact
        run: python scripts/build-expert-memory.py --handbook upstream-handbook --check
